name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  multi-target:
    uses: alsi-lawr/package-release-workflows/.github/workflows/rust-bun.yml@main
    with:
      rids: >-
        [{"rid":"linux-x64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"rid":"win-x64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]
      script: scripts/ci.sh

  publish-image:
    name: Publish Docker image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: multi-target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: alsilawr/phrasic
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
